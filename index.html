<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gujarat in Numbers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Gujarat in Numbers</h1>
  <p>Source: NFHS-5 (2019-21, provisional). These are survey estimates, not a full count.</p>

  <select id="indicator">
    <option value="sex_ratio">Sex ratio</option>
    <option value="female_school_pct">Women who ever attended school (%)</option>
    <option value="pop_below15_pct">Population below age 15 (%)</option>
  </select>

  <div id="mapLegend"></div>
  <div class="map-wrap">
    <div id="tileMap"></div>
  </div>

  <canvas id="myChart" width="800" height="900"></canvas>

  <table id="dataTable"></table>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
